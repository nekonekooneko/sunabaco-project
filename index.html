<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>喫茶店在庫管理</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ===== ヘッダー ===== -->
    <header class="site-header">
        <h1 class="site-title">喫茶店向け在庫管理ミニアプリ(仮)</h1>
        <nav class="site-nav">
            <a href="#search-area">検索</a>
            <a href="#add-item">商品追加</a>
            <a href="#inventory">在庫一覧</a>
        </nav>
    </header>

    <main>

        <!-- 🔍 商品検索 -->
        <section id="search-area">
            <h2>商品検索</h2>
            <input type="text" id="searchInput" placeholder="商品名で検索">
            <button id="searchBtn">検索</button>
        </section>

        <!-- ➕ 商品追加 -->
        <section id="add-item">
            <h2>商品追加</h2>
            <form id="addItemForm">
                <label>
                    商品名：
                    <input type="text" id="itemName" required>
                </label>
                <label>
                    在庫数：
                    <input type="number" id="itemStock" required>
                </label>
                <button type="submit">追加</button>
            </form>
        </section>

        <!-- 📦 在庫一覧 -->
        <section id="inventory">
            <h2>在庫一覧</h2>
            <table>
                <thead>
                    <tr>
                        <th>商品名</th>
                        <th>在庫数</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="inventoryBody">
                    <tr>
                        <td class="name">コーヒー豆</td>
                        <td class="stock">40</td>
                        <td>
                            <button class="action-btn" data-action="out">出庫</button>
                            <button class="action-btn" data-action="order">発注</button>
                        </td>
                    </tr>
                    <tr>
                        <td class="name">バニラアイス</td>
                        <td class="stock">5</td>
                        <td>
                            <button class="action-btn" data-action="out">出庫</button>
                            <button class="action-btn" data-action="order">発注</button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </section>

        <!-- 🚨 メッセージ表示 -->
        <section id="message-area">
            <p id="messageText">ここにメッセージが表示されます</p>
        </section>

    </main>

    <footer>
        <p>© 2026 SUNABACO Team</p>
    </footer>

    <!-- ★ JS読み込み（bodyの一番下が超重要） -->
    <script src="script.js"></script>
</body>
</html>
